spring.application.name=ninjas

#URL de conexão com o banco (endereço + porta + nome do banco)
spring.datasource.url=jdbc:postgresql://localhost:5432/ninjas

#Usuário do banco de dador
spring.datasource.username=postgres

#Senha
spring.datasource.password=123456

#Driver responsável por fazer a conexão com o PostgreSQl
spring.datasource.driver-class-name=org.postgresql.Driver

#Define como o Hibernate vai gerenciar as tabelas (update = cria/atualiza sem apagar dados)
spring.jpa.hibernate.ddl-auto=update

#Mostra no console as consultas SQl executadas
spring.jpa.show-sql=true

#Formata o SQL exibido no console para facilitar leitura
spring.jpa.properties.hibernate.format_sql=true

#Define o tipo de banco utilizado (dialeto do PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect